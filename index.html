<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Studio - With Custom Voice Upload</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b1329; color: #f1f5f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #162038; border-radius: 12px; max-width: 650px; width: 100%; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { font-size: 20px; color: #38bdf8; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 15px; font-size: 13px; font-weight: bold; color: #94a3b8; }
        textarea, input[type="text"], input[type="file"] {
            width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #293859;
            background: #0b1329; color: #fff; font-size: 14px;
        }
        .user-box { background: #1e293b; border: 1px dashed #38bdf8; border-radius: 8px; padding: 14px; margin-top: 15px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: #0f172a; border: 1px solid #334155; padding: 4px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; }
        .tag:hover { background: #0284c7; }
        button {
            width: 100%; margin-top: 20px; padding: 12px; background: #0284c7; color: white;
            border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #0369a1; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎙️ AI + Custom Voice Studio</h1>

    <label>1. बैकएंड API Link (LocalTunnel URL):</label>
    <input type="text" id="apiUrl" placeholder="https://xxxx.loca.lt">

    <!-- खुद की आवाज़ अपलोड करने का बॉक्स -->
    <div class="user-box">
        <label style="margin-top:0; color:#38bdf8;">👤 आपकी खुद की आवाज़ (Custom Voice Upload):</label>
        <label style="font-weight:normal; font-size:12px;">स्क्रिप्ट में आपका नाम क्या होगा? (उदा. Sonu या Me):</label>
        <input type="text" id="myActorName" value="Sonu">

        <label style="font-weight:normal; font-size:12px; margin-top:8px;">अपनी बोली हुई ऑडियो फाइल अपलोड करें (.mp3/.wav/.m4a):</label>
        <input type="file" id="myAudioFile" accept="audio/*">
    </div>

    <label>रेडीमेड AI एक्टर्स (क्लिक करके स्क्रिप्ट में जोड़ें):</label>
    <div class="tag-list">
        <span class="tag" onclick="insertActor('Sonu')">Sonu (आपकी आवाज़)</span>
        <span class="tag" onclick="insertActor('Priya')">Priya (AI)</span>
        <span class="tag" onclick="insertActor('Rohan')">Rohan (AI)</span>
        <span class="tag" onclick="insertActor('Amitabh')">Amitabh (AI)</span>
        <span class="tag" onclick="insertActor('Shinchan')">Shinchan (AI)</span>
        <span class="tag" onclick="insertActor('DadaJi')">DadaJi (AI)</span>
    </div>

    <label>2. अपनी बातचीत की स्क्रिप्ट लिखें:</label>
    <textarea id="scriptText" rows="6" placeholder="Sonu: अरे प्रिया, यह तो मेरी अपनी रिकॉर्ड की हुई आवाज़ है!&#10;Priya: और यह मेरी AI आवाज़ है! दोनों एक साथ मर्ज हो रहे हैं।"></textarea>

    <button onclick="generateHybridAudio()">⚡ ऑडियो जनरेट और डाउनलोड करें</button>
    <div id="status"></div>
</div>

<script>
function insertActor(name) {
    const area = document.getElementById('scriptText');
    area.value += (area.value.endsWith('\n') || area.value === '' ? '' : '\n') + `${name}: `;
    area.focus();
}

async function generateHybridAudio() {
    const apiUrl = document.getElementById('apiUrl').value.trim();
    const script = document.getElementById('scriptText').value.trim();
    const myActorName = document.getElementById('myActorName').value.trim();
    const myAudioFile = document.getElementById('myAudioFile').files[0];
    const status = document.getElementById('status');

    if (!apiUrl || !script) {
        alert("कृपया बैकएंड URL और स्क्रिप्ट भरें!");
        return;
    }

    const formData = new FormData();
    formData.append("script", script);
    formData.append("my_actor_name", myActorName);
    if (myAudioFile) {
        formData.append("my_voice_file", myAudioFile);
    }

    status.innerText = "⏳ आपकी आवाज़ और AI आवाज़ों को मर्ज किया जा रहा है...";

    try {
        const res = await fetch(`${apiUrl}/generate-hybrid`, {
            method: "POST",
            headers: {
                "Bypass-Tunnel-Reminder": "true"
            },
            body: formData
        });

        if (!res.ok) throw new Error("ऑडियो बनाने में एरर आया!");

        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = window.URL.createObjectURL(blob);
        a.download = "final_hybrid_dialogue.mp3";
        a.click();

        status.innerText = "✅ आपकी आवाज़ के साथ पूरा ऑडियो डाउनलोड हो गया!";
    } catch (e) {
        status.innerText = "❌ एरर: " + e.message;
    }
}
</script>
</body>
</html>
